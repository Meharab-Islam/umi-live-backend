# ════════════════════════════════════════════
#  Big Eater — Docker Compose
#  Run:  docker compose up -d --build
#  Stop: docker compose down
# ════════════════════════════════════════════

services:
  big-eater:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: big-eater-game
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database across container restarts
      - game_data:/app/data
      - ./public:/app/public
      - ./server.js:/app/server.js
      - ./db:/app/db
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/game.db
      TZ: Asia/Dhaka
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  game_data:
    driver: local
    name: big_eater_game_data
