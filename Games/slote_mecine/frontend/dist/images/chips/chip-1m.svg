<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="cg-1M" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
    <filter id="cshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#cshadow)">
    <!-- Outer Rim -->
    <circle cx="50" cy="50" r="46" fill="url(#cg-1M)" stroke="#fecdd3" stroke-width="3"/>
    <!-- Dashed Inner Pattern -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="9 13" opacity="0.9"/>
    <!-- Inner Body Ring -->
    <circle cx="50" cy="50" r="32" fill="url(#cg-1M)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Inner Center Plate -->
    <circle cx="50" cy="50" r="24" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
    <!-- Text -->
    <text x="50" y="56" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.8))">1M</text>
    <!-- Gloss shine -->
    <ellipse cx="42" cy="32" rx="16" ry="8" transform="rotate(-30 42 32)" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>