services:
  # ─── MySQL Database ────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: slot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword@2024
      MYSQL_DATABASE: slotgame
      MYSQL_USER: slotuser
      MYSQL_PASSWORD: SlotPass@2024
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPassword@2024"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slot_network

  # ─── Node.js Backend & Realtime Socket.IO ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slot_backend
    restart: always
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: slotuser
      DB_PASSWORD: SlotPass@2024
      DB_NAME: slotgame
      WEBHOOK_SECRET: live_stream_slot_secret_2024
    ports:
      - "3001:3001"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - slot_network

  # ─── Frontend Web App (Tailwind + SCSS + Vite) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slot_frontend
    restart: always
    networks:
      - slot_network

  # ─── Nginx Reverse Proxy (Unified Port 80) ─────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: slot_nginx
    restart: always
    ports:
      - "80:80"
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - slot_network

volumes:
  mysql_data:

networks:
  slot_network:
    driver: bridge
