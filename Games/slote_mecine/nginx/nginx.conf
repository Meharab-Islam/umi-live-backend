events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend_nodes {
        server backend:3001;
    }

    upstream frontend_nodes {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Max body size for webhook payloads
        client_max_body_size 10M;

        # Frontend static files & single-page application
        location / {
            proxy_pass http://frontend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket Gateway for Socket.IO
        location /socket.io/ {
            proxy_pass http://backend_nodes/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Backend REST & Webhook APIs
        location /api/ {
            proxy_pass http://backend_nodes/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /health {
            proxy_pass http://backend_nodes/health;
            proxy_set_header Host $host;
        }
    }
}
