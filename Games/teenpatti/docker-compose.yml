services:
  mongodb:
    image: mongo:6.0
    container_name: teenpatti_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - teenpatti_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teenpatti_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/teenpatti
      - ADMIN_BASE_URL=https://control.imlive.live/
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - teenpatti_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teenpatti_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - teenpatti_network

volumes:
  mongodb_data:

networks:
  teenpatti_network:
    driver: bridge
